<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>Remote Desktop</title>
  <link rel="stylesheet" href="viewer.css">
  <script type="module" src="viewer.js"></script>
</head>
<body>
  <main id="screen" aria-label="Remote Windows screen"></main>

  <footer id="controls" hidden>
    <button id="keyboard-button" type="button">Keyboard</button>
    <button id="secure-attention" type="button">Ctrl+Alt+Del</button>
    <button id="refresh-screen" type="button">Refresh screen</button>
    <label class="quality-picker">
      Quality
      <select id="quality">
        <option value="save-data">Save data</option>
        <option value="balanced" selected>Balanced</option>
        <option value="sharper">Sharper</option>
      </select>
    </label>
  </footer>
  <input id="remote-keyboard" type="password" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Remote keyboard">
</body>
</html>
